[project]
name = "kap-mcp-server"
version = "0.2.0"
description = "MCP server for Borsa İstanbul: KAP disclosures + Yahoo Finance market data and news"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["kap", "bist", "mcp", "borsa", "finance"]
authors = [{ name = "Çağrı Güngör" }]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pypdf>=4.0",
    "yfinance>=0.2.50",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "respx>=0.21"]
web = ["django>=5.1", "uvicorn[standard]>=0.30", "whitenoise>=6.6", "python-multipart>=0.0.9"]

[project.urls]
Homepage = "https://github.com/hasancagrigungor/kapmcp"
Repository = "https://github.com/hasancagrigungor/kapmcp"
Issues = "https://github.com/hasancagrigungor/kapmcp/issues"

[project.scripts]
kapmcp = "kap_mcp.server:main"
kap-mcp = "kap_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kap_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
include = ["/kap_mcp", "/tests", "/docs", "/README.md", "/LICENSE", "/pyproject.toml", "/.env.example"]
